name: 3DS build
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
jobs:
  devkitpro:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            artifact: ctrHexenII-3dsx
          - mode: noaudio
            artifact: ctrHexenII-sleep-noaudio
    steps:
      - uses: actions/checkout@v4
      - name: Build OpenDSP library
        run: |
          # Pin the sleep/HOME audio-resume fix, rather than whichever commit
          # happens to be at the tip of main when CI runs.
          git init -q /tmp/OpenDSP
          git -C /tmp/OpenDSP remote add origin https://github.com/Cellenseres/OpenDSP.git
          git -C /tmp/OpenDSP fetch --depth=1 origin a15c8615c1659f34bfb2b38df69a9860f4cc7080
          git -C /tmp/OpenDSP checkout --detach FETCH_HEAD
          test "$(git -C /tmp/OpenDSP rev-parse HEAD)" = "a15c8615c1659f34bfb2b38df69a9860f4cc7080"
          make -C /tmp/OpenDSP/library install
      - name: Build 3DSX
        run: |
          if [ "${{ matrix.mode }}" = "noaudio" ]; then
            make -j2 H2_SLEEP_DIAG_NO_AUDIO=1
          else
            make -j2
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.artifact }}
          path: ctrHexenII.3dsx
